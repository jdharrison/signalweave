name: Release

on:
  push:
    branches:
      - 'release/v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-release:
    name: Validate, build bundles and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from branch name
        id: meta
        run: |
          VERSION=${GITHUB_REF_NAME#release/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # ── Toolchain setup ────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ── Rust workspace validation ──────────────────────────────────────────
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust workspace
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Client validation ──────────────────────────────────────────────────
      - name: Build server (debug, for live client tests)
        run: cargo build -p woven-server

      - name: Validate TypeScript client
        working-directory: crates/woven-client-ts
        run: |
          npm ci
          npm run check
          npm run test:decode-fixture
          npm run test:decode-tool-call-completed
          npm run test:decode

      - name: Validate C# client
        working-directory: crates/woven-client-csharp/test
        run: dotnet test

      - name: Validate Python client
        working-directory: crates/woven-client-python/test
        run: |
          pip install -r requirements.txt
          pytest

      # ── Build server release binary ────────────────────────────────────────
      - name: Build server release binary
        run: cargo build -p woven-server --release

      # ── Create release bundles ─────────────────────────────────────────────
      - name: Create release bundles
        run: |
          mkdir -p dist
          VERSION="${{ steps.meta.outputs.version }}"

          # Server binary (Linux x64)
          cp target/release/woven-server "dist/woven-server-${VERSION}-linux-x64"
          tar -czf "dist/woven-server-${VERSION}-linux-x64.tar.gz" \
            -C dist "woven-server-${VERSION}-linux-x64"
          rm "dist/woven-server-${VERSION}-linux-x64"

          # Rust client source crate
          tar -czf "dist/woven-client-rust-${VERSION}.tar.gz" \
            crates/woven-client-rust

          # TypeScript client bindings
          tar -czf "dist/woven-client-ts-${VERSION}.tar.gz" \
            -C crates/woven-client-ts \
            package.json tsconfig.json generated/

          # C# client bindings
          zip -r "dist/woven-client-csharp-${VERSION}.zip" \
            crates/woven-client-csharp \
            -x "*/bin/*" -x "*/obj/*"

          # Python client bindings
          tar -czf "dist/woven-client-python-${VERSION}.tar.gz" \
            --exclude='__pycache__' --exclude='*.pyc' \
            crates/woven-client-python

      # ── Publish GitHub Release ─────────────────────────────────────────────
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            --target "${GITHUB_SHA}" \
            || true
          gh release upload "${TAG}" --clobber dist/*
